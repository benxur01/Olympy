# Xavfsizlik sarlavhalari — FAQAT nginx o'zi beradigan (statik) javoblar uchun.
# Konteynerda: /etc/nginx/snippets/security-headers.conf
#
# NIMA UCHUN server DARAJASIDA EMAS:
# Django javoblariga (olympy_api/middleware.py SecurityHeadersMiddleware) bu
# sarlavhalarning O'Z versiyasi allaqachon qo'shiladi — o'z CSP'si bilan birga.
# Nginx ularni proxy javoblariga ham qo'shsa, brauzer IKKI xil CSP oladi va
# ularning KESISHMASINI qo'llaydi. Bu Django admin panelini buzardi (admin
# inline skript/stil ishlatadi, frontend CSP'si esa ularga ruxsat bermaydi).
# Shu sababli snippet faqat statik location'larga `include` qilinadi.
#
# NIMA UCHUN HAR LOCATION'DA TAKRORLANADI:
# nginx'da add_header pastki darajaga faqat o'sha darajada birorta ham
# add_header bo'lmasa meros bo'ladi. Bitta location'da add_header paydo
# bo'lsa, yuqoridagilarning HAMMASI yo'qoladi — shuning uchun aniq `include`.
#
# render.yaml dagi static_site header'lari bilan bir xil (Render'dan
# ko'chishda himoya darajasi pasaymasin).

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# CSP render.yaml dagining aynan o'zi, ikki farq bilan:
#   - connect-src'dan Render manzillari (*.onrender.com, api.prolymp.uz) olib
#     tashlandi: endi frontend va API bitta origin ('self').
#   - API'ni alohida subdomenga (masalan https://api.domen.uz) chiqarsangiz,
#     uni connect-src ga QO'SHING, aks holda barcha so'rovlar bloklanadi.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; img-src 'self' data: blob: https:; connect-src 'self' https://*.sentry.io https://*.ingest.sentry.io https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; font-src 'self' data: https://fonts.gstatic.com; frame-ancestors 'none'" always;
