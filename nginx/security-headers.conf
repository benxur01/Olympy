# Xavfsizlik sarlavhalari — FAQAT nginx o'zi beradigan (statik) javoblar uchun.
# Konteynerda: /etc/nginx/snippets/security-headers.conf
#
# NIMA UCHUN server DARAJASIDA EMAS:
# Django javoblariga (olympy_api/middleware.py SecurityHeadersMiddleware) bu
# sarlavhalarning O'Z versiyasi allaqachon qo'shiladi — o'z CSP'si bilan birga.
# Nginx ularni proxy javoblariga ham qo'shsa, brauzer IKKI xil CSP oladi va
# ularning KESISHMASINI qo'llaydi. Bu Django admin panelini buzardi (admin
# inline skript/stil ishlatadi, frontend CSP'si esa ularga ruxsat bermaydi).
# Shu sababli snippet faqat statik location'larga `include` qilinadi.
#
# NIMA UCHUN HAR LOCATION'DA TAKRORLANADI:
# nginx'da add_header pastki darajaga faqat o'sha darajada birorta ham
# add_header bo'lmasa meros bo'ladi. Bitta location'da add_header paydo
# bo'lsa, yuqoridagilarning HAMMASI yo'qoladi — shuning uchun aniq `include`.
#
# render.yaml dagi static_site header'lari bilan bir xil (Render'dan
# ko'chishda himoya darajasi pasaymasin).

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions-Policy — brauzer imkoniyatlarini eng kam huquq bilan cheklaydi.
# camera/microphone `self` BO'LISHI SHART: kamera va ovoz proktoringi
# getUserMedia ishlatadi (pages/OlympiadTest.jsx:1141 va :1195). Ularni `()`
# qilib yopsak proktoring butunlay ishlamaydi. `self` — faqat o'z origin,
# uchinchi tomon iframe'iga bu huquq berilmaydi. geolocation loyihada
# ishlatilmaydi, shuning uchun to'liq yopiq.
# DIQQAT: Django middleware (backend/olympy_api/middleware.py:123) `camera=()`
# yuboradi — bu API JSON javoblari uchun to'g'ri; bu snippet esa faqat statik
# location'larga include qilinadi, ya'ni ikkisi bir-biriga xalaqit bermaydi.
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;

# HSTS — Django allaqachon AYNAN shu qiymatni yuboradi; Contabo'da /api/ va
# statik fayllar bitta origin (prolymp.uz) bo'lgani uchun ikkisi mos bo'lishi
# kerak, aks holda brauzer bir origin uchun ikki xil HSTS oladi.
# DIQQAT: hozir nginx.conf'da faqat 80-port (HTTP) bloki faol, 443 bloki
# izohda. HSTS'ni brauzerlar SHIFRLANMAGAN ulanishda spetsifikatsiya bo'yicha
# E'TIBORSIZ qoldiradi, ya'ni TLS yoqilmaguncha bu qator zarar ham keltirmaydi,
# foyda ham bermaydi — sertifikat o'rnatilib 443 bloki ochilgach o'zi ishlaydi.
# `includeSubDomains`: 2026-08-07 holatiga ko'ra xavfsiz (www HTTPS ishlaydi,
# api.prolymp.uz DNS'da yo'q). Yangi subdomen qo'shilsa u BIRINCHI kundan
# HTTPS bo'lishi shart.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# CSP render.yaml dagining aynan o'zi, ikki farq bilan:
#   - connect-src'dan Render manzillari (*.onrender.com, api.prolymp.uz) olib
#     tashlandi: endi frontend va API bitta origin ('self').
#   - API'ni alohida subdomenga (masalan https://api.domen.uz) chiqarsangiz,
#     uni connect-src ga QO'SHING, aks holda barcha so'rovlar bloklanadi.
#
# PROKTORING (TensorFlow.js FaceMesh) uchun QO'SHIMCHA host KERAK EMAS:
# model fayllari public/models/ ichida (dist/models/ ga ko'chadi) va
# `connect-src 'self'` ularni qamrab oladi. Avval paket ularni tfhub.dev'dan
# yuklardi — bu CSP tomonidan bloklanib, kamera proktoringini JIMGINA
# o'chirardi. faceWorker.js same-origin module worker (`default-src 'self'`
# yetarli), tfjs esa faqat WebGL backend ishlatadi, ya'ni `unsafe-eval` /
# `wasm-unsafe-eval` TALAB QILINMAYDI. Bu satrga tashqi model hosti
# QO'SHISH SHART EMAS — qo'shsangiz himoyani bekorga bo'shashtirasiz.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; img-src 'self' data: blob: https:; connect-src 'self' https://*.sentry.io https://*.ingest.sentry.io https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; font-src 'self' data: https://fonts.gstatic.com; frame-ancestors 'none'" always;
