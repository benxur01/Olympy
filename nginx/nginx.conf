# Olympy — Contabo VPS uchun Nginx konfiguratsiyasi.
#
# Bu fayl konteynerda /etc/nginx/conf.d/default.conf ga ko'chiriladi
# (nginx/Dockerfile), ya'ni rasmiy nginx.conf ning `http { ... }` bloki ichida
# include qilinadi. Shu sababli bu yerda faqat `upstream` va `server` bloklari.
#
# Vazifasi:
#   1. Frontend (Vite `dist/`) statik fayllarini berish — SPA fallback bilan.
#   2. /api/ va Django admin so'rovlarini `backend` (gunicorn) ga uzatish.
#   3. Django statik (/static/) va media (/media/) fayllarini to'g'ridan-to'g'ri
#      named volume'dan berish — gunicorn/WhiteNoise ni bezovta qilmasdan.

# ─── Cloudflare: haqiqiy klient IP (ngx_http_realip_module) ─────────────────
# Production trafigi Browser → Cloudflare → nginx → Django yo'lidan o'tadi
# (jonli javoblarda `server: cloudflare` va `cf-ray` sarlavhalari bor). DNS
# Contabo IP'siga ko'chirilgandan keyin ham Cloudflare domen oldida qoladi.
#
# Cloudflare TCP ulanishni O'ZI ochadi, ya'ni bu blok bo'lmasa nginx uchun
# $remote_addr — Cloudflare edge serverining IP'si, foydalanuvchining emas.
# Natijasi:
#   • moderation.BlockedIPMiddleware (commit fcd70b6) barcha foydalanuvchilarni
#     bir nechta CF edge IP'si sifatida ko'radi — bitta buzg'unchini bloklash
#     u bilan bir edge'dan kelgan yuzlab begunoh foydalanuvchini ham bloklaydi;
#   • DRF throttling hammani bitta bucket'ga qo'shadi va limit ma'nosiz bo'ladi.
#
# Yechim: Cloudflare har so'rovga `CF-Connecting-IP` sarlavhasini O'ZI yozadi
# (klient yuborgan qiymat ustiga yozib ketadi — soxtalashtirib bo'lmaydi).
# `set_real_ip_from` bilan FAQAT Cloudflare oraliqlaridan kelgan ulanishlarda
# shu sarlavhaga ishonamiz va $remote_addr ni haqiqiy klient IP'siga almashtiramiz.
#
# CLOUDFLARE ISHLATILMAGANDA HAM XAVFSIZ: boshqa manzildan (masalan to'g'ridan
# to'g'ri VPS IP'siga) kelgan so'rovda `set_real_ip_from` oraliqlari MOS
# KELMAYDI, ya'ni `CF-Connecting-IP` butunlay e'tiborsiz qoldiriladi va
# $remote_addr haqiqiy TCP manzili bo'lib qoladi. Ya'ni hujumchi bu sarlavhani
# soxtalashtirib IP-bloklashni chetlab o'ta olmaydi — na Cloudflare orqali,
# na uni aylanib o'tib.
#
# `real_ip_recursive` ATAYIN o'rnatilmagan (default `off`): CF-Connecting-IP
# bitta IP saqlaydi, zanjir emas — rekursiya bu holatda ma'nosiz.
#
# ┌─ IP ORALIQLARINI YANGILASH ────────────────────────────────────────────────┐
# │ Cloudflare oraliqlari vaqt o'tishi bilan o'zgaradi (yangi oraliq qo'shilsa │
# │ o'sha edge'lardan kelgan trafik yana CF IP'si sifatida ko'rinadi).         │
# │ Tekshirish (oyiga bir marta yetarli):                                     │
# │     bash deploy/update-cloudflare-ips.sh                                  │
# │ Farq topilsa skript tayyor blokni chop etadi — uni AYNAN shu markerlar    │
# │ orasiga qo'ying, repoga commit qiling va qayta deploy qiling               │
# │ (`bash scripts/deploy_contabo.sh`). VPS'da faylni QO'LDA tahrirlamang:     │
# │ nginx.conf image ichiga build vaqtida ko'chiriladi va deploy skripti      │
# │ `git merge --ff-only` qiladi — lokal o'zgarish merge'ni to'xtatib qo'yadi. │
# │ Manba: https://www.cloudflare.com/ips-v4 , https://www.cloudflare.com/ips-v6│
# │ Oxirgi tekshirilgan: 2026-08-07                                           │
# └───────────────────────────────────────────────────────────────────────────┘
# >>> CLOUDFLARE-IPS-BEGIN (deploy/update-cloudflare-ips.sh shu markerlarga tayanadi — o'chirmang)
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
# <<< CLOUDFLARE-IPS-END
real_ip_header CF-Connecting-IP;

# ── Rate limiting (autentifikatsiyasiz endpointlar) ─────────────────────────
# NEGA: DRF throttling (settings.py DEFAULT_THROTTLE_RATES) allaqachon
# batafsil sozlangan, ammo u Django'ga YETIB KELGANDAN keyin ishlaydi —
# rad etilgan har bir so'rov ham bitta gunicorn worker'ini va Redis
# borish-kelishini sarflaydi. Bu blok esa floodni gunicorn'gacha to'sadi.
# Cloudflare bilan birga uchinchi qatlam bo'ladi; DRF limitlarining o'rnini
# BOSMAYDI, ular ancha aniqroq.
#
# `$binary_remote_addr` — realip bloki tufayli HAQIQIY klient IP'si
# (Cloudflare edge IP'si emas), ya'ni bitta CF node ortidagi hamma
# foydalanuvchi bir hisoblagichga tushib qolmaydi.
#
# `map` ishlatilishining sababi: limitni faqat ayrim yo'llarga qo'llash uchun
# alohida `location` blok ochish kerak bo'lardi va u `location /api/` dagi
# ~40 qator proxy sozlamasini takrorlashni talab qilardi (bir kun ikkisi
# ajralib qolishi muqarrar). nginx bo'sh kalitli so'rovga limit QO'LLAMAYDI —
# shuning uchun `default ""` qolgan barcha API yo'llarini chetlab o'tkazadi.
map $request_uri $olympy_public_limit_key {
    default          "";
    # Login, ro'yxatdan o'tish, OTP yuborish, parol tiklash.
    ~^/api/auth/     $binary_remote_addr;
    # Sertifikat QR'ini tekshirish — AllowAny, ya'ni tokensiz ochiq.
    ~^/api/portfolio/ $binary_remote_addr;
}

# 60r/m = sekundiga 1 so'rov, burst 30 — normal foydalanuvchi (hatto parolni
# bir necha marta xato kiritsa ham) BUNGA YAQIN kelmaydi. Ataylab keng
# olingan: mobil operatorlar CGNAT ortida ko'p abonentni bitta IP'ga
# joylashtiradi, tor limit ularni birdan qulflab qo'yardi.
limit_req_zone $olympy_public_limit_key zone=olympy_public:10m rate=60r/m;
# 503 (default) emas, 429: throttling ekanini klient ham, monitoring ham
# to'g'ri tushunsin va uni backend uzilishi bilan chalkashtirmasin.
limit_req_status 429;
limit_req_log_level warn;

upstream olympy_backend {
    # `backend` — docker-compose.yml dagi xizmat nomi (Docker ichki DNS).
    server backend:8000;
    # Keepalive ulanishlar — har so'rovda yangi TCP handshake qilinmasin.
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;

    # TODO (domen olingach): `_` o'rniga haqiqiy domenni yozing, masalan:
    #   server_name prolymp.uz www.prolymp.uz;
    # `_` — "har qanday Host" (IP orqali smoke-test uchun qulay).
    server_name _;

    # Frontend build (nginx/Dockerfile 2-bosqichida ko'chiriladi).
    root /usr/share/nginx/html;
    index index.html;

    # Eng katta qabul qilinadigan yuklama. Backendning eng katta limiti —
    # Speaking javob audiosi 25MB (settings.py SPEAKING_AUDIO_MAX_BYTES; AI
    # savol PDF'i 20MB — AI_QUESTION_PDF_MAX_BYTES). Multipart sarlavhalari va
    # chegara satrlari uchun zaxira bilan 30m: qiymat backend limitiga TENG
    # bo'lsa ham, chegaraga yaqin fayl multipart qo'shimchasi bilan nginx
    # limitidan oshib ketadi va foydalanuvchi Django'ning tushunarli
    # ("Audio juda katta. Limit: 25 MB") xatosi o'rniga nginx'ning umumiy 413
    # sahifasini ko'radi.
    client_max_body_size 30m;

    # Log'lar stdout/stderr'ga (nginx image default) → `docker compose logs`.

    # ── Gzip ────────────────────────────────────────────────────────────────
    # FAQAT statik fayllar uchun. Dinamik (proxy) javoblarda quyida ATAYIN
    # `gzip off` — settings.py da GZipMiddleware ham aynan shu sababdan
    # o'chirilgan: CSRF token kabi maxfiy qiymatlarni o'z ichiga olgan javobni
    # siqish BREACH hujumiga yo'l ochadi.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff2;

    # ── Maxfiylik siyosati (Google Play / App Store talabi) ─────────────────
    # public/_redirects va render.yaml dagi rewrite qoidalarining ekvivalenti.
    # `last` — qayta location tanlanadi, ya'ni javobni quyidagi `location /`
    # beradi (xavfsizlik sarlavhalari bilan).
    rewrite ^/privacy/?$ /privacy.html last;

    # ── Let's Encrypt (certbot) HTTP-01 tekshiruvi ──────────────────────────
    # Sertifikat olish uchun domen DNS'i shu VPS IP'siga ko'rsatilgan bo'lishi
    # SHART. Katalog docker-compose.yml da bind mount qilingan.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
    }

    # ── Backend: API ────────────────────────────────────────────────────────
    # DIQQAT: bu blokda ATAYIN add_header YO'Q — xavfsizlik sarlavhalarini
    # (CSP ham) Django o'zi qo'shadi (SecurityHeadersMiddleware). Batafsil:
    # nginx/security-headers.conf.
    location /api/ {
        gzip off;

        # Faqat `$olympy_public_limit_key` bo'sh BO'LMAGAN yo'llarga ta'sir
        # qiladi (yuqoridagi `map`: /api/auth/ va /api/portfolio/). Qolgan API
        # yo'llari uchun kalit bo'sh — nginx limitni umuman qo'llamaydi.
        # `nodelay` — burst ichidagi so'rovlar SEKINLASHTIRILMASDAN darhol
        # o'tadi (navbatga qo'yilsa login sekin ishlagandek tuyulardi); limit
        # faqat burst tugagach 429 bera boshlaydi.
        limit_req zone=olympy_public burst=30 nodelay;

        proxy_pass http://olympy_backend;
        proxy_http_version 1.1;
        # Keepalive uchun `Connection` bo'sh bo'lishi kerak (upstream keepalive).
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        # USE_X_FORWARDED_HOST=True (settings.py) — Django absolute URL'larni
        # aynan shu sarlavhadan quradi.
        proxy_set_header X-Forwarded-Host $host;
        # $remote_addr — yuqoridagi realip bloki tufayli Cloudflare orqali
        # kelgan so'rovlarda ham HAQIQIY klient IP'si.
        proxy_set_header X-Real-IP $remote_addr;
        # DIQQAT: ataylab `$proxy_add_x_forwarded_for` EMAS.
        #
        # `$proxy_add_x_forwarded_for` klient yuborgan X-Forwarded-For qiymatini
        # SAQLAB oxiriga $remote_addr ni qo'shadi. Django tomonida IP'ni o'qish
        # ikki xil: aksariyati OXIRGI elementni oladi (xavfsiz), ammo
        # accounts.AuditLog.log BIRINCHI elementni oladi — ya'ni hujumchi
        # `X-Forwarded-For: 1.2.3.4` yuborib audit yozuvlariga soxta IP
        # yozdira olardi.
        #
        # Faqat $remote_addr yuborilsa zanjirda AYNAN BITTA, nginx o'zi
        # aniqlagan (soxtalashtirilishi mumkin bo'lmagan) qiymat qoladi va
        # birinchi ham, oxirgi ham AYNAN SHU element bo'ladi:
        #   • accounts.AuditLog.log       → [0]   ✓
        #   • security_logging.client_ip  → [-1]  ✓ (BlockedIPMiddleware shundan)
        #   • accounts LoginEvent         → [-1]  ✓
        #   • billing._client_ip          → [-1]  ✓
        #   • DRF throttling (NUM_PROXIES=1) → [-1] ✓
        # Klient yuborgan zanjir tashlab yuboriladi — bu ilovada undan hech kim
        # foydalanmaydi.
        proxy_set_header X-Forwarded-For $remote_addr;
        # SECURE_PROXY_SSL_HEADER = ('HTTP_X_FORWARDED_PROTO', 'https') —
        # HTTPS yoqilgach Django SSL redirect tsiklini shu orqali aniqlaydi.
        #
        # ATAYIN $scheme (Cloudflare yuborgan X-Forwarded-Proto EMAS): shunda
        # Django "HTTPS" deb faqat nginx O'ZI TLS'ni terminate qilganda hisoblaydi.
        # DIQQAT (Cloudflare): CF'ning SSL rejimi "Flexible" bo'lsa CF→origin
        # ulanishi HTTP bo'ladi, $scheme=http bo'lib qoladi va
        # OLYMPY_SECURE_SSL_REDIRECT=1 bilan cheksiz redirect halqasi paydo
        # bo'ladi (ERR_TOO_MANY_REDIRECTS). Cloudflare SSL/TLS rejimi MAJBURIY
        # "Full (strict)" bo'lishi kerak — batafsil: deploy/README.md → "TLS (MAJBURIY)".
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        # gunicorn `--timeout 300` bilan mos: AI savol generatsiyasi va PDF
        # tahlili uzoq davom etadi. Kichikroq qiymat 504 berardi.
        proxy_read_timeout 300s;
        # Katta yuklamalarni (PDF import) diskka buferlamasdan uzatish.
        proxy_request_buffering off;
    }

    # ── Backend: Django admin ───────────────────────────────────────────────
    # URL ataylab noaniq (urls.py: bot skanerlaridan yashirish uchun).
    location /olympy-mgmt-2025/ {
        gzip off;

        proxy_pass http://olympy_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Sabab /api/ blokidagi kabi: soxtalashtirilmaydigan yagona qiymat.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
    }

    # ── Django statik fayllari (admin CSS/JS) ───────────────────────────────
    # `release` qadamidagi collectstatic natijasi — static_data volume orqali
    # /var/www/olympy/static ga ulangan. Nginx to'g'ridan-to'g'ri beradi,
    # gunicorn thread'i band bo'lmaydi.
    # `alias` EMAS, `root` ishlatilgan (alias + try_files kombinatsiyasi
    # nginx'da nozik xatolarga sabab bo'ladi): /static/x → /var/www/olympy/static/x.
    # Fayllar content-hash bilan nomlangan (WhiteNoise ManifestStaticFiles),
    # shuning uchun uzoq muddatli kesh xavfsiz.
    location /static/ {
        root /var/www/olympy;
        include /etc/nginx/snippets/security-headers.conf;
        expires 30d;
        access_log off;
    }

    # ── Yuklangan media fayllar ─────────────────────────────────────────────
    # CLOUDINARY_CLOUD_NAME o'rnatilgan bo'lsa media URL'lari to'g'ridan-to'g'ri
    # Cloudinary domeniga ketadi va bu blok ishlatilmaydi (zararsiz qoladi).
    # Cloudinary'siz esa fayllar media_data volume'ida saqlanadi.
    location /media/ {
        root /var/www/olympy;
        include /etc/nginx/snippets/security-headers.conf;
        expires 30d;
        access_log off;
    }

    # ── Frontend: hash'langan bundle'lar ────────────────────────────────────
    # Vite har build'da fayl nomiga content-hash qo'shadi — uzoq muddatli
    # keshlash xavfsiz (o'zgargan fayl yangi nom oladi).
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        access_log off;
    }

    # ── Frontend: keshlanmasligi kerak bo'lgan fayllar ──────────────────────
    # index.html hash'langan bundle nomlarini o'z ichiga oladi: keshlansa
    # foydalanuvchi eski deploy'da qotib qolardi.
    # sw.js — service worker; eski nusxa keshda qolsa ilova yangilanmaydi.
    # `expires -1` → "Cache-Control: no-cache".
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        expires -1;
    }
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        expires -1;
    }

    # ── Frontend SPA ────────────────────────────────────────────────────────
    # Har qanday noma'lum yo'l index.html ga tushadi (klient-side routing).
    # try_files ning OXIRGI parametri ichki redirect qiladi, ya'ni javobni
    # yuqoridagi `location = /index.html` beradi.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}

# ── HTTPS (TLS) ─────────────────────────────────────────────────────────────
# Sertifikat olish uchun HAQIQIY domen kerak va uning DNS A/AAAA yozuvi shu VPS
# IP'siga ko'rsatishi shart — shu sababli bu blok hozircha izohda.
#
# ⚠ BU IXTIYORIY EMAS. Cutover MAJBURIY bandi: TLS'siz login umuman ishlamaydi
# (auth cookie'lari `Secure`) va barcha parollar ochiq matnda ketadi. To'liq
# tartibli checklist: deploy/README.md → "TLS (MAJBURIY)".
#
# CLOUDFLARE ORTIDA sertifikat olish (chicken-and-egg): CF'da "Always Use
# HTTPS" yoqilgan bo'lsa HTTP-01 tekshiruvi HTTPS'ga redirect qilinadi, origin
# esa hali sertifikatsiz → CF 526 xatosi beradi va certbot muvaffaqiyatsiz
# tugaydi. Yechim: DNS yozuvini VAQTINCHA "DNS only" (kulrang bulut) qilib
# qo'ying, sertifikatni oling, so'ng proxy'ni qayta yoqing va SSL/TLS rejimini
# "Full (strict)" ga o'rnating.
#
# Cutover kunida, DNS ko'chgandan keyin (deploy/README.md → "TLS (MAJBURIY)"):
#
#   1) Sertifikat olish (host mashinada, stack ishlab turganda):
#        cd /opt/olympy && docker run --rm \
#          -v "$PWD/deploy/certbot/www:/var/www/certbot" \
#          -v "$PWD/deploy/certbot/conf:/etc/letsencrypt" \
#          certbot/certbot certonly --webroot -w /var/www/certbot \
#          -d prolymp.uz -d www.prolymp.uz \
#          --email siz@example.com --agree-tos --no-eff-email
#
#   2) docker-compose.yml da nginx xizmatiga sertifikat volume'ini ulang
#      (izohdagi qatorni oching):
#        - ./deploy/certbot/conf:/etc/letsencrypt:ro
#      443 porti allaqachon publish qilingan.
#
#   3) Quyidagi blokni izohdan chiqaring, domenni yozing va yuqoridagi 80-port
#      server blokida ACME location'idan TASHQARI hammasini HTTPS'ga
#      yo'naltiring:
#        location / { return 301 https://$host$request_uri; }
#
#   4) backend/.env da OLYMPY_SECURE_SSL_REDIRECT=1 va
#      OLYMPY_SECURE_HSTS_SECONDS=31536000 qiling, so'ng:
#        docker compose up -d --force-recreate backend celery-worker celery-beat
#        docker compose exec nginx nginx -t && docker compose exec nginx nginx -s reload
#
#   5) Sertifikatni avtomatik yangilash (cron, oyiga bir marta yetarli):
#        0 3 1 * * cd /opt/olympy && docker run --rm \
#          -v "$PWD/deploy/certbot/www:/var/www/certbot" \
#          -v "$PWD/deploy/certbot/conf:/etc/letsencrypt" \
#          certbot/certbot renew --webroot -w /var/www/certbot --quiet \
#          && docker compose exec nginx nginx -s reload
#
# server {
#     listen 443 ssl;
#     listen [::]:443 ssl;
#     http2 on;
#     server_name prolymp.uz www.prolymp.uz;
#
#     ssl_certificate     /etc/letsencrypt/live/prolymp.uz/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/prolymp.uz/privkey.pem;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_prefer_server_ciphers off;
#     ssl_session_cache shared:SSL:10m;
#     ssl_session_timeout 1d;
#
#     # HSTS ni nginx darajasida QO'SHMANG — Django SecurityMiddleware
#     # (SECURE_HSTS_SECONDS) uni o'zi qo'shadi; ikki marta yuborilgan sarlavhani
#     # brauzerlar e'tiborsiz qoldirishi mumkin.
#
#     # Yuqoridagi 80-port blokidagi barcha location/gzip/client_max_body_size
#     # sozlamalarini shu yerga ko'chiring (yoki umumiy qismni alohida faylga
#     # chiqarib `include` qiling).
#     #
#     # `set_real_ip_from` / `real_ip_header` ni KO'CHIRISH KERAK EMAS: ular
#     # fayl boshida, http darajasida turadi va har bir server bloki ularni
#     # avtomatik meros oladi.
# }
