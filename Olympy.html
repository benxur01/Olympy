       yangilaydi — aks holda sahifa avval dark chizilib keyin light'ga
       sakrardi (FOUC). Ataylab `defer`/`async`SIZ (bloklovchi) va ataylab
       inline EMAS: CSP `script-src` da 'unsafe-inline' yo'q. Batafsil sabab
       `public/theme-init.js` boshidagi izohda.
       ?v= — sw.js statik fayllarni cache-first saqlaydi (public/sw.js),
       hash'siz fayl eski keshda qolib ketmasin (sw.js?v=… bilan bir naqsh). -->

  <!-- Shriftlar self-hosted: `public/fonts/*.woff2` + src/index.css dagi

       olib tashlandi: tashqi so'rov yo'q va matn render'i uchinchi tomon
       javobiga bog'liq emas. -->
  <!-- Tailwind CDN olib tashlandi: avval https://cdn.tailwindcss.com 1+ MB JS yuklardi
       va render kechikishi yaratardi. Endi Tailwind PostCSS plugin orqali build paytida
       CSS generatsiya qilinadi (tailwind.config.js + postcss.config.js + src/index.css). -->
  <!-- Google Identity Services SDK (Google OAuth).
       Client ID bu yerda inline skript bilan berilmaydi: production CSP
       `script-src` da 'unsafe-inline' saqlamaydi, shuning uchun bunday blok
       brauzerda bloklanardi — `window.GOOGLE_CLIENT_ID` hech qachon
       o'rnatilmasdi va konsolda CSP violation chiqardi. Qiymat build paytida
       `VITE_GOOGLE_CLIENT_ID` env orqali beriladi (pages/Auth.jsx). -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
