# Render injects PORT; default 8081 locally.
server.port=${PORT:8081}

# Django (source of truth) base URL. The introspection and duel-result
# endpoints are derived from this. Override via DJANGO_BASE_URL in prod.
django.base-url=${DJANGO_BASE_URL:http://localhost:8000}

# Shared secret sent as X-Internal-Service-Secret on server-to-server calls to
# Django. MUST match Django's INTERNAL_SERVICE_SECRET. Empty by default so a
# misconfigured deploy fails loudly rather than talking to Django unauthenticated.
internal.service-secret=${INTERNAL_SERVICE_SECRET:}

# Per-question answer window (seconds) before the duel auto-advances.
duel.question-timeout-seconds=${DUEL_QUESTION_TIMEOUT:15}

# Redis — jonli viktorina xonalarining snapshot'lari uchun (RoomStore).
# olympy-api / olympy-celery bilan BIR XIL instansiya (render.yaml: REDIS_URL).
spring.data.redis.url=${REDIS_URL:redis://localhost:6379/0}

# Xona holatini Redis'ga yozishni yoqadigan bayroq. Default O'CHIQ: xizmat
# jonli darslarga xizmat qilyapti, shuning uchun kod avval "qorong'i" holda
# chiqadi (hech qanday Redis buyrug'i yuborilmaydi) va faqat kuzatuvdan keyin
# QUIZ_REDIS_PERSISTENCE_ENABLED=true bilan yoqiladi. O'chiq bo'lsa xatti-harakat
# avvalgidek: xona faqat xotirada, restart uni yo'qotadi.
quiz.redis-persistence.enabled=${QUIZ_REDIS_PERSISTENCE_ENABLED:false}

# Actuator: expose only the health endpoint.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
# Redis health indicator O'CHIQ. Aks holda spring-boot-starter-data-redis
# qo'shilishining o'zi /actuator/health ni Redis'ga bog'lab qo'yardi: REDIS_URL
# berilmagan (yoki Redis vaqtincha yiqilgan) holatda health DOWN qaytarib,
# Render deploy'ni "unhealthy" deb rad etardi — bayroq o'chiq bo'lsa ham.
# Redis bu xizmat uchun ixtiyoriy (faqat snapshot), shuning uchun u tirikligi
# jonli viktorina ishlashiga shart emas.
management.health.redis.enabled=false
