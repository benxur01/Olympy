services:
  api:
    build: .
    container_name: olympy-backend-go
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      OLYMPY_DB_ENGINE: "sqlite"
      OLYMPY_DB_NAME: "/app/data/olympy.db"
      JWT_SECRET: "${JWT_SECRET:-dev-only-change-in-production}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}"
    volumes:
      - backend_data:/app/data

volumes:
  backend_data:
