# Dependabot versiya yangilanishlari (haftalik PR). Zaiflik ogohlantirishlari
# va xavfsizlik PR'lari bu fayl bilan emas, repo sozlamasida yoqiladi:
# Settings → Code security → Dependabot alerts / security updates.
version: 2
updates:
  # Backend — CI (`render-deploy.yml`) va Render `requirements.txt` ni
  # o'rnatadi. `requirements.lock` (Docker) ni Dependabot YANGILAMAYDI (faqat
  # `.txt`/`.in` fayllarni o'qiydi) — requirements.txt o'zgargach lock'ni
  # qo'lda qayta generatsiya qiling (buyruq `backend/Dockerfile` da).
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
  # Frontend — package.json repo ildizida.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  # Workflow'lardagi action'lar to'liq SHA bilan pin qilingan — Dependabot
  # SHA'ni ham, yonidagi `# vX.Y.Z` izohini ham yangilaydi.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
