name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Go Vet, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: ci-test-secret-key-not-for-production
      PORT: '8000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Verify Go dependencies
        run: go mod verify
      - name: Run Go vet
        run: go vet ./...
      - name: Run Go tests
        run: CGO_ENABLED=0 go test -v ./...
      - name: Build Go binary
        run: CGO_ENABLED=0 go build -v -o /dev/null ./cmd/api

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
