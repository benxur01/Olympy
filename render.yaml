services:
  # ── Frontend (React/Vite static site) ─────────────────────────────────────
  - type: static_site
    name: olympy
    repo: https://github.com/benxur01/Olympy
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      # Frontend Sentry DSN — Vite build paytida o'qiladi (VITE_ prefiks).
      # Bo'sh bo'lsa Sentry init o'tkazib yuboriladi (graceful fallback).
      - key: VITE_SENTRY_DSN
        sync: false
      # Web Push public kaliti — backend/olympy-celery servislaridagi
      # VAPID_PUBLIC_KEY bilan BIR XIL qiymat kiritilishi shart (Render
      # dashboard'da qo'lda). Faqat public key; VAPID_PRIVATE_KEY frontend
      # env'iga hech qachon tushmasin.
      - key: VITE_VAPID_PUBLIC_KEY
        sync: false
    routes:
      # Maxfiylik siyosati — static HTML (Google Play / App Store uchun)
      - type: rewrite
        source: /privacy
        destination: /privacy.html
      - type: rewrite
        source: /privacy/
        destination: /privacy.html
      # Backend API proxy — `prolymp.uz/api/...` so'rovlarini olympy-api
      # servisiga uzatadi.
      #
      # NEGA BU YERDA: qoida avval FAQAT Render dashboard'ida qo'lda yozilgan
      # edi, render.yaml'da esa yo'q. 2026-08-11 da konfiguratsiya API orqali
      # sinxronlana boshlagach (scripts/sync-render-static-config.mjs, PUT
      # "replace all" semantikasiga ega) ro'yxatga kirmagan bu qoida
      # O'CHIRILDI va prolymp.uz/api/health/ landing page qaytara boshladi.
      # Endi yagona manba shu fayl — sinxronlash uni saqlab qoladi.
      #
      # Frontend bundle API'ni to'g'ridan-to'g'ri olympy-api.onrender.com'dan
      # so'raydi (src/services/api.js DEFAULT_API_BASE_URL), ya'ni saytning
      # o'zi bu proxy'ga bog'liq EMAS. Lekin undan boshqa iste'molchilar
      # foydalanadi — eski keshlangan bundle'lar, mobil ilova va to'lov
      # webhook'lari (Click/Payme) — shuning uchun qoida saqlanadi.
      #
      # SHAKLI: rewrite destination'i to'liq tashqi URL bo'lishi mumkin va
      # `*` mos kelgan qismga almashadi, ya'ni /api/health/ →
      # https://olympy-api.onrender.com/api/health/. Destination'da `/api`
      # prefiksi ham TURISHI SHART — backend yo'llari /api/ ostida
      # (`.../*` deb yozilsa prefiks yo'qolib 404 bo'lardi).
      #
      # TARTIB: bu qoida quyidagi SPA catch-all'dan OLDIN turishi shart, aks
      # holda /api/... ham index.html'ga tushadi.
      - type: rewrite
        source: /api/*
        destination: https://olympy-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    # Xavfsizlik headerlari — clickjacking, MIME-sniffing va XSS himoyasi.
    headers:
      # Render'ning /* glob'i bare root '/' ni ba'zan qamramaydi — shuning
      # uchun har bir header uchun aniq '/' entry ham qo'shildi (root document
      # ham, boshqa yo'llar ham aniq qoplansin).
      - path: /
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Permissions-Policy — brauzer imkoniyatlarini eng kam huquq tamoyili
      # bilan cheklaydi. Kamera va mikrofon `self` BO'LISHI SHART (kamera/ovoz
      # proktoringi getUserMedia ishlatadi — qarang pages/OlympiadTest.jsx:1141
      # va :1195). `()` (butunlay yopiq) qilib qo'yilsa proktoring ishlamaydi.
      # `self` — faqat o'z origin'imiz; uchinchi tomon iframe'iga berilmaydi.
      # geolocation loyihada UMUMAN ishlatilmaydi, shuning uchun to'liq yopiq.
      # DIQQAT: backend (Django middleware.py:123) `camera=()` yuboradi — bu
      # to'g'ri, chunki API JSON javoblarida kamera kerak emas; faqat frontend
      # HTML hujjatida `self` bo'lishi kerak.
      - path: /
        name: Permissions-Policy
        value: camera=(self), microphone=(self), geolocation=(), payment=(), usb=()
      - path: /*
        name: Permissions-Policy
        value: camera=(self), microphone=(self), geolocation=(), payment=(), usb=()
      # HSTS — backend allaqachon aynan shu qiymatni yuboradi (Django
      # SecurityHeadersMiddleware), shuning uchun static qatlam ham mos
      # bo'lishi kerak: Contabo'da /api/ va statik fayllar BITTA origin
      # (prolymp.uz) bo'ladi va bir xil origin ikki xil HSTS yubormasligi
      # kerak. `includeSubDomains` hozir xavfsiz — 2026-08-07 holatiga ko'ra
      # faqat www.prolymp.uz mavjud (HTTPS ishlaydi), api.prolymp.uz esa
      # umuman DNS'da YO'Q. ESLATMA: api.prolymp.uz keyinchalik yaratilsa,
      # u BIRINCHI kundan HTTPS bilan ishga tushirilishi shart, aks holda
      # includeSubDomains tufayli brauzerlar unga ulanmaydi.
      - path: /
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains; preload
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains; preload
      # CSP real resurslarga moslangan: Google Fonts (index.html), Cloudinary
      # rasmlar (https:), API (api.prolymp.uz / onrender) va Sentry (connect).
      # Google Identity Services (Google orqali kirish) uchun accounts.google.com
      # ruxsat etiladi: gsi/client skripti (script-src), One Tap iframe
      # (frame-src), so'rovlar (connect-src) va injected stillar (style-src).
      #
      # PROKTORING (TensorFlow.js FaceMesh) uchun QO'SHIMCHA host KERAK EMAS:
      #   - model fayllari public/models/ ichida, ya'ni `connect-src 'self'`
      #     ularni qamrab oladi (avval tfhub.dev/kaggle.com'dan yuklanardi va
      #     CSP ularni bloklab, proktoringni jimgina o'chirardi);
      #   - faceWorker.js — same-origin module worker, `default-src 'self'`
      #     (worker-src fallback) yetarli;
      #   - tfjs faqat WebGL backend'ida ishlaydi — `unsafe-eval` yoki
      #     `wasm-unsafe-eval` TALAB QILMAYDI (WASM backend o'rnatilmagan).
      # Ya'ni bu CSP'ni bo'shashtirmasdan proktoring to'liq ishlaydi.
      - path: /
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; img-src 'self' data: blob: https:; connect-src 'self' https://api.prolymp.uz https://*.onrender.com https://*.sentry.io https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; font-src 'self' data: https://fonts.gstatic.com; frame-ancestors 'none'"
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; img-src 'self' data: blob: https:; connect-src 'self' https://api.prolymp.uz https://*.onrender.com https://*.sentry.io https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; font-src 'self' data: https://fonts.gstatic.com; frame-ancestors 'none'"

  # ── Backend API (Go + Gin) ────────────────────────────────────────────────
  - type: web_service
    name: olympy-api
    repo: https://github.com/benxur01/Olympy
    rootDir: backend
    env: go
    region: ohio
    plan: starter
    branch: main
    buildCommand: go mod download && go build -o olympy-api ./cmd/api
    startCommand: ./olympy-api
    numInstances: 1
    healthCheckPath: /api/health/
    envVars:
      - key: OLYMPY_DB_ENGINE
        value: "sqlite"
      - key: OLYMPY_DB_NAME
        value: "olympy.db"
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://prolymp.uz,https://www.prolymp.uz,https://olympy.onrender.com,http://localhost:5173,http://127.0.0.1:5173"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: TELEGRAM_AUTH_BOT_TOKEN
        sync: false
      - key: TELEGRAM_MANAGER_BOT_TOKEN
        sync: false
      - key: TELEGRAM_AUTH_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_MANAGER_WEBHOOK_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JUDGE0_URL
        sync: false
      - key: JUDGE0_API_KEY
        sync: false
      - key: CLICK_SERVICE_ID
        sync: false
      - key: CLICK_MERCHANT_ID
        sync: false
      - key: CLICK_SECRET_KEY
        sync: false
      - key: PAYME_MERCHANT_ID
        sync: false
      - key: PAYME_SECRET_KEY
        sync: false

# Fon vazifalari (worker) endi Go backend ichida goroutine'lar orqali
# ishlaydi (backend/internal/services/worker.go) — alohida Celery xizmati shart emas.

