services:
  # ── Frontend (React/Vite static site) ─────────────────────────────────────
  - type: static_site
    name: olympy
    repo: https://github.com/benxur01/Olympy
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      # Frontend Sentry DSN — Vite build paytida o'qiladi (VITE_ prefiks).
      # Bo'sh bo'lsa Sentry init o'tkazib yuboriladi (graceful fallback).
      - key: VITE_SENTRY_DSN
        sync: false
      # Java real-time xizmat (jonli duel + "Kahoot uslubidagi" jonli
      # viktorina) manzili — quyidagi `olympy-realtime` xizmatiga ishora
      # qiladi. Bo'sh bo'lsa frontend Django bilan bir xil origin'ga
      # (olympy-api) so'rov yuboradi va u yerda mos yo'l topilmay xato
      # beradi — shu sababli aniq qiymat majburiy.
      - key: VITE_REALTIME_BASE_URL
        value: https://olympy-realtime.onrender.com
    routes:
      # Maxfiylik siyosati — static HTML (Google Play / App Store uchun)
      - type: rewrite
        source: /privacy
        destination: /privacy.html
      - type: rewrite
        source: /privacy/
        destination: /privacy.html
      - type: rewrite
        source: /*
        destination: /index.html
    # Xavfsizlik headerlari — clickjacking, MIME-sniffing va XSS himoyasi.
    headers:
      # Render'ning /* glob'i bare root '/' ni ba'zan qamramaydi — shuning
      # uchun har bir header uchun aniq '/' entry ham qo'shildi (root document
      # ham, boshqa yo'llar ham aniq qoplansin).
      - path: /
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # CSP real resurslarga moslangan: Google Fonts (index.html), Cloudinary
      # rasmlar (https:), API (api.prolymp.uz / onrender) va Sentry (connect).
      # Google Identity Services (Google orqali kirish) uchun accounts.google.com
      # ruxsat etiladi: gsi/client skripti (script-src), One Tap iframe
      # (frame-src), so'rovlar (connect-src) va injected stillar (style-src).
      - path: /
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; img-src 'self' data: blob: https:; connect-src 'self' https://api.prolymp.uz https://*.onrender.com https://*.sentry.io https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; font-src 'self' data: https://fonts.gstatic.com; frame-ancestors 'none'"
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; img-src 'self' data: blob: https:; connect-src 'self' https://api.prolymp.uz https://*.onrender.com https://*.sentry.io https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; font-src 'self' data: https://fonts.gstatic.com; frame-ancestors 'none'"

  # ── Backend API (Django + Gunicorn) ────────────────────────────────────────
  - type: web_service
    name: olympy-api
    repo: https://github.com/benxur01/Olympy
    rootDir: backend
    env: python
    region: ohio
    plan: standard
    branch: main
    buildCommand: ./render_build.sh
    startCommand: ./render_start.sh
    # Media fayllar Cloudinary'ga ko'chirildi (CLOUDINARY_* env var'lar) —
    # endi disk dependency'si yo'q va servis horizontal scale qilinishi
    # mumkin. numInstances'ni 2+ ga oshirish uchun disk bo'limi olib
    # tashlandi. DIQQAT: disk olib tashlangach, eski (Cloudinary'gacha
    # yuklangan) media fayllar Render diskidan yo'qoladi — yangi yuklamalar
    # Cloudinary'da saqlanadi.
    numInstances: 1
    healthCheckPath: /api/health/
    # Uptime monitoring: UptimeRobot (uptimerobot.com) da bepul monitor yarating
    # URL: https://prolymp.uz/api/health/ — 5 daqiqada bir tekshiradi
    # Alert: Telegram yoki email orqali xabar beradi
    envVars:
      # Alohida celery worker (olympy-celery) yoqilganda 1 qiling — web OOM kamayadi.
      - key: CELERY_EXTERNAL_WORKER
        value: "0"
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: OLYMPY_SECRET_KEY
        sync: false
      - key: OLYMPY_ALLOWED_HOSTS
        sync: false
      - key: OLYMPY_CORS_ALLOWED_ORIGINS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: TELEGRAM_AUTH_BOT_TOKEN
        sync: false
      - key: TELEGRAM_MANAGER_BOT_TOKEN
        sync: false
      # Telegram webhook maxfiy tokenlari — kelgan webhook'larni tasdiqlash
      # uchun (accounts/views.py). Production'da o'rnatilishi shart, aks holda
      # webhook 403 qaytaradi. Auth bot va manager bot uchun alohida.
      - key: TELEGRAM_AUTH_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_MANAGER_WEBHOOK_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Judge0 kod runner ("Ishga tushirish"). JUDGE0_URL bo'sh bo'lsa public CE
      # API (ce.judge0.com) ishlatiladi; JUDGE0_API_KEY berilsa RapidAPI Judge0
      # CE (ko'proq limit). Ikkalasi ham ixtiyoriy.
      - key: JUDGE0_URL
        sync: false
      - key: JUDGE0_API_KEY
        sync: false
      # Sentry backend DSN — bo'sh bo'lsa monitoring o'chiq qoladi.
      - key: SENTRY_DSN
        sync: false
      # Web Push — bo'sh bo'lsa push o'chiq (private key repoda bo'lmasin).
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      # Email — MAILGUN_API_KEY o'rnatilsa Mailgun backend yoqiladi, aks holda
      # console backend (email yuborilmaydi). Barchasi ixtiyoriy.
      - key: EMAIL_BACKEND
        sync: false
      - key: MAILGUN_API_KEY
        sync: false
      - key: MAILGUN_SENDER_DOMAIN
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # To'lov provayderlari (Click va Payme) — webhook'lar shu web service'da
      # qayta ishlanadi. Qiymatlar maxfiy, Render dashboard'da qo'lda kiritiladi.
      - key: CLICK_SERVICE_ID
        sync: false
      - key: CLICK_MERCHANT_ID
        sync: false
      - key: CLICK_SECRET_KEY
        sync: false
      - key: PAYME_MERCHANT_ID
        sync: false
      - key: PAYME_SECRET_KEY
        sync: false
      # Java real-time xizmat (quyida, olympy-realtime) server-serverga shu
      # sirni X-Internal-Service-Secret header'da yuboradi (masalan viktorina
      # tugagach natijani Django'ga yozganda). Ikkala xizmatda BIR XIL qiymat
      # bo'lishi shart — Render dashboard'da qo'lda kiritiladi.
      - key: INTERNAL_SERVICE_SECRET
        sync: false

  # ── Java real-time xizmat (jonli duel + "Kahoot uslubidagi" viktorina) ─────
  # Django'dan alohida: WebSocket orqali xona/duel holatini xotirada saqlaydi.
  # `render.yaml`da avval bu xizmat umuman yo'q edi — shu sabab production'da
  # "Xona yaratib bo'lmadi" xatosi berardi (frontend so'rovi Django'ga borib,
  # Django bu yo'lni bilmagani uchun 404 qaytarardi).
  - type: web_service
    name: olympy-realtime
    repo: https://github.com/benxur01/Olympy
    rootDir: backend-java
    env: docker
    region: ohio
    plan: starter
    branch: main
    # Spring Boot ishga tushishi bir necha soniya davom etadi. healthCheckPath
    # bo'lmasa Render yangi instansiyaga tayyor bo'lishidan oldin trafik
    # yuboradi va bu oynada qirra 502 qaytaradi. 502 sahifasida CORS
    # sarlavhalari yo'q, shuning uchun brauzer cross-origin `fetch`ni butunlay
    # rad etadi — o'quvchi jonli viktorinaga qo'shilolmaydi. Ilova aynan shu
    # endpoint'ni ochib qo'ygan (application.properties: actuator health).
    healthCheckPath: /actuator/health
    envVars:
      # Introspection (JWT tekshiruv) va natija yozish uchun Django manzili.
      - key: DJANGO_BASE_URL
        value: https://olympy-api.onrender.com
      # olympy-api xizmatidagi bilan BIR XIL qiymat bo'lishi shart.
      - key: INTERNAL_SERVICE_SECRET
        sync: false

  # ── Celery worker (ixtiyoriy ajratish) ─────────────────────────────────────
  # Yoqish: shu service'ni create + olympy-api da CELERY_EXTERNAL_WORKER=1.
  # Default o'chiq bo'lishi mumkin (plan); qo'lda enable qiling.
  - type: worker
    name: olympy-celery
    repo: https://github.com/benxur01/Olympy
    rootDir: backend
    env: python
    region: ohio
    plan: starter
    branch: main
    buildCommand: ./render_build.sh
    startCommand: celery -A olympy_api worker -B -l info -c 1 --scheduler django_celery_beat.schedulers:DatabaseScheduler
    envVars:
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: OLYMPY_SECRET_KEY
        sync: false
      - key: OLYMPY_ALLOWED_HOSTS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_AUTH_BOT_TOKEN
        sync: false
      - key: TELEGRAM_MANAGER_BOT_TOKEN
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

# Database va Redis allaqachon Render dashboard'da yaratilgan.
# render.yaml faqat service konfiguratsiyasini tavsiflab beradi —
# mavjud resurslar saqlanib qoladi, qayta yaratilmaydi.

