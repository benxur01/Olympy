# Olympy — Go Backend + React Frontend stack (Docker Compose).
#
# Ishga tushirish:
#   docker compose up -d --build
#
# Frontend: http://localhost:80 (nginx)
# Go API:   http://localhost:8000 (va /api/* orqali nginx ichidan)

name: olympy

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── Go API (Gin + SQLite) ─────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
    image: olympy-backend:latest
    env_file:
      - path: backend/.env
        required: false
    environment:
      PORT: "8000"
      OLYMPY_DB_ENGINE: "sqlite"
      OLYMPY_DB_NAME: "/app/data/olympy.db"
      JWT_SECRET: "${JWT_SECRET:-olympy_docker_dev_secret_2026}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost,http://localhost:5173,http://127.0.0.1:5173}"
    volumes:
      - db_data:/app/data
      - static_data:/app/staticfiles
      - media_data:/app/media
      - evidence_data:/app/evidence_media
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8000/api/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging

  # ── Nginx: frontend + reverse proxy ───────────────────────────────────────
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-/}"
        VITE_SENTRY_DSN: "${VITE_SENTRY_DSN:-}"
        VITE_GOOGLE_CLIENT_ID: "${VITE_GOOGLE_CLIENT_ID:-}"
        VITE_VAPID_PUBLIC_KEY: "${VITE_VAPID_PUBLIC_KEY:-}"
    image: olympy-nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_data:/var/www/olympy/static:ro
      - media_data:/var/www/olympy/media:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging

volumes:
  db_data:
  static_data:
  media_data:
  evidence_data:
