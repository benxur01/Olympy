<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="mistakes-title mistakes-desc" class="olympy-shot">
  <title id="mistakes-title">Olympy mistakes screenshot</title>
  <desc id="mistakes-desc">AI Xatolar Sandig'i: yo'l qo'yilgan xatolar ro'yxati va sun'iy intellekt tahlili.</desc>
  <style>
    /* ─── Ranglar bu yerda QATTIQ yozilmagan ──────────────────────────────
       Qiymatlar sahifaning token qatlamidan (src/index.css) keladi. Bu fayl
       DOM ichiga INLINE joylanadi (pages/Landing.jsx), shuning uchun :root
       o'zgaruvchilari shu yerga meros bo'ladi va `data-theme` almashganda
       skrinshot ham o'zi qayta bo'yaladi — ikkinchi (light) nusxa kerak emas.

       var() zaxiralari faqat fayl ALOHIDA ochilganda ishlaydi (to'g'ridan
       to'g'ri brauzerda yoki img tegi orqali) — img tegi tashqi CSS'ni
       ko'rmaydi. Ilova ichida bu zaxiralar hech qachon qo'llanmaydi, shuning
       uchun token qiymatlari o'zgarsa bu fayllarni yangilash SHART EMAS.

       DIQQAT: bu style bloki ichida burchakli qavs ishlatilmaydi. SVG
       markup'i HTML parseri orqali DOM'ga inline joylanadi va u yerda
       style ichidagi burchakli qavs teg deb o'qilib, blokni buzadi.

       Yo'nalish: gradient yo'q, glow yo'q, rangli soya yo'q. Ajratish uchun
       1px chegara va bo'shliq. */
    svg.olympy-shot {
      --ground: rgb(var(--color-ground, 231 228 220));
      --s1: rgb(var(--color-surface-1, 238 236 229));
      --s2: rgb(var(--color-surface-2, 222 219 210));
      --edge: rgb(var(--color-edge, 199 195 184));
      --t2: rgb(var(--color-text-secondary, 98 101 111));
      --accent: rgb(var(--color-accent, 192 54 44));
      --stamp: rgb(var(--color-accent-fill, 192 54 44));
      --on-stamp: rgb(var(--color-on-accent, 251 243 242));
      --pencil: rgb(var(--color-accent-2, 47 93 140));
      --ok: rgb(var(--color-success, 47 107 68));
      --warn: rgb(var(--color-warning, 127 95 48));
      --err: rgb(var(--color-error, 168 62 23));
      color: rgb(var(--color-text-primary, 20 22 28));
      font-family: 'PT Sans', Arial, sans-serif;
    }
    .olympy-shot text { fill: currentColor }
    .olympy-shot .b { font-weight: 700 }
    .olympy-shot .desk { fill: var(--s2) }
    .olympy-shot .page { fill: var(--ground); stroke: var(--edge) }
    .olympy-shot .rail { fill: var(--s1) }
    .olympy-shot .card { fill: var(--s1); stroke: var(--edge) }
    .olympy-shot .well { fill: var(--ground); stroke: var(--edge) }
    .olympy-shot .chip { fill: var(--s2); stroke: var(--edge) }
    .olympy-shot .avatar { fill: var(--s2); stroke: var(--edge) }
    .olympy-shot .track { fill: var(--s2) }
    .olympy-shot .rule { fill: none; stroke: var(--edge) }
    /* Rang sinflari `color` ni ham o'rnatadi: shunda ayni shu elementdagi
       `.icon` ning `stroke: currentColor` i o'sha rangni oladi va matn bilan
       ikonka bir xil bo'yaladi (class="icon ok" kabi juftliklar uchun). */
    .olympy-shot .dim { fill: var(--t2); color: var(--t2) }
    .olympy-shot .ac { fill: var(--accent); color: var(--accent) }
    .olympy-shot .stamp-fill { fill: var(--stamp) }
    .olympy-shot .on-stamp { fill: var(--on-stamp); color: var(--on-stamp) }
    .olympy-shot .pencil { fill: var(--pencil); color: var(--pencil) }
    .olympy-shot .ok { fill: var(--ok); color: var(--ok) }
    .olympy-shot .warn { fill: var(--warn); color: var(--warn) }
    .olympy-shot .err { fill: var(--err); color: var(--err) }
    /* Holat qutilari — ilovaning badge naqshi (12% to'ldirish, 35% chegara). */
    .olympy-shot .ac-box { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-opacity: .35 }
    .olympy-shot .ok-box { fill: var(--ok); fill-opacity: .12; stroke: var(--ok); stroke-opacity: .35 }
    .olympy-shot .warn-box { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-opacity: .35 }
    .olympy-shot .pencil-box { fill: var(--pencil); fill-opacity: .12; stroke: var(--pencil); stroke-opacity: .35 }
    /* Ikonkalar — shared.jsx dagi Icon komponenti bilan bir xil Lucide geometriyasi. */
    .olympy-shot .icon { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
  </style>
