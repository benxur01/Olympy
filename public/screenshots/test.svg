<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="test-title test-desc" class="olympy-shot">
  <title id="test-title">Olympy test interface screenshot</title>
  <desc id="test-desc">Online olimpiada test oynasi: taymer, savol, javob variantlari va savollar navigatori.</desc>
  <style>
    /* ─── Ranglar bu yerda QATTIQ yozilmagan ──────────────────────────────
       Qiymatlar sahifaning token qatlamidan (src/index.css) keladi. Bu fayl
       DOM ichiga INLINE joylanadi (pages/Landing.jsx), shuning uchun :root
       o'zgaruvchilari shu yerga meros bo'ladi va `data-theme` almashganda
       skrinshot ham o'zi qayta bo'yaladi — ikkinchi (light) nusxa kerak emas.

       var() zaxiralari faqat fayl ALOHIDA ochilganda ishlaydi (to'g'ridan
       to'g'ri brauzerda yoki img tegi orqali) — img tegi tashqi CSS'ni
       ko'rmaydi. Ilova ichida bu zaxiralar hech qachon qo'llanmaydi, shuning
       uchun token qiymatlari o'zgarsa bu fayllarni yangilash SHART EMAS.

       DIQQAT: bu style bloki ichida burchakli qavs ishlatilmaydi. SVG
       markup'i HTML parseri orqali DOM'ga inline joylanadi va u yerda
       style ichidagi burchakli qavs teg deb o'qilib, blokni buzadi.

       Yo'nalish: gradient yo'q, glow yo'q, rangli soya yo'q. Ajratish uchun
       1px chegara va bo'shliq. */
    svg.olympy-shot {
      --ground: rgb(var(--color-ground, 231 228 220));
      --s1: rgb(var(--color-surface-1, 238 236 229));
      --s2: rgb(var(--color-surface-2, 222 219 210));
      --edge: rgb(var(--color-edge, 199 195 184));
      --t2: rgb(var(--color-text-secondary, 98 101 111));
      --accent: rgb(var(--color-accent, 192 54 44));
      --stamp: rgb(var(--color-accent-fill, 192 54 44));
      --on-stamp: rgb(var(--color-on-accent, 251 243 242));
      --pencil: rgb(var(--color-accent-2, 47 93 140));
      --ok: rgb(var(--color-success, 47 107 68));
      --warn: rgb(var(--color-warning, 127 95 48));
      --err: rgb(var(--color-error, 168 62 23));
      color: rgb(var(--color-text-primary, 20 22 28));
      font-family: 'PT Sans', Arial, sans-serif;
    }
    .olympy-shot text { fill: currentColor }
    .olympy-shot .b { font-weight: 700 }
    .olympy-shot .desk { fill: var(--s2) }
    .olympy-shot .page { fill: var(--ground); stroke: var(--edge) }
    .olympy-shot .rail { fill: var(--s1) }
    .olympy-shot .card { fill: var(--s1); stroke: var(--edge) }
    .olympy-shot .well { fill: var(--ground); stroke: var(--edge) }
    .olympy-shot .chip { fill: var(--s2); stroke: var(--edge) }
    .olympy-shot .avatar { fill: var(--s2); stroke: var(--edge) }
    .olympy-shot .track { fill: var(--s2) }
    .olympy-shot .rule { fill: none; stroke: var(--edge) }
    /* Rang sinflari `color` ni ham o'rnatadi: shunda ayni shu elementdagi
       `.icon` ning `stroke: currentColor` i o'sha rangni oladi va matn bilan
       ikonka bir xil bo'yaladi (class="icon ok" kabi juftliklar uchun). */
    .olympy-shot .dim { fill: var(--t2); color: var(--t2) }
    .olympy-shot .ac { fill: var(--accent); color: var(--accent) }
    .olympy-shot .stamp-fill { fill: var(--stamp) }
    .olympy-shot .on-stamp { fill: var(--on-stamp); color: var(--on-stamp) }
    .olympy-shot .pencil { fill: var(--pencil); color: var(--pencil) }
    .olympy-shot .ok { fill: var(--ok); color: var(--ok) }
    .olympy-shot .warn { fill: var(--warn); color: var(--warn) }
    .olympy-shot .err { fill: var(--err); color: var(--err) }
    /* Holat qutilari — ilovaning badge naqshi (12% to'ldirish, 35% chegara). */
    .olympy-shot .ac-box { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-opacity: .35 }
    .olympy-shot .ok-box { fill: var(--ok); fill-opacity: .12; stroke: var(--ok); stroke-opacity: .35 }
    .olympy-shot .warn-box { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-opacity: .35 }
    .olympy-shot .pencil-box { fill: var(--pencil); fill-opacity: .12; stroke: var(--pencil); stroke-opacity: .35 }
    /* Ikonkalar — shared.jsx dagi Icon komponenti bilan bir xil Lucide geometriyasi. */
    .olympy-shot .icon { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
  </style>
  <rect class="desk" width="1440" height="900"/>
  <rect class="page" x="72" y="60" width="1296" height="780" rx="10"/>

  <!-- Yuqori qator -->
  <g transform="translate(118 104)">
    <rect class="stamp-fill" width="40" height="38" rx="4"/>
    <text class="on-stamp b" x="20" y="26" text-anchor="middle" font-size="19">O</text>
    <text class="b" x="54" y="26" font-size="23">Olympy</text>
    <rect class="warn-box" x="934" y="-2" width="150" height="44" rx="4"/>
    <g class="icon warn" transform="translate(952 11) scale(.75)"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></g>
    <text class="warn b" x="980" y="26" font-size="15">42:18</text>
    <rect class="ok-box" x="1100" y="-2" width="128" height="44" rx="4"/>
    <text class="ok b" x="1164" y="26" text-anchor="middle" font-size="14">Saqlanmoqda</text>
  </g>

  <!-- Savol paneli -->
  <g transform="translate(118 176)">
    <rect class="card" width="840" height="560" rx="8"/>
    <rect class="pencil-box" x="32" y="32" width="188" height="38" rx="4"/>
    <text class="pencil b" x="126" y="57" text-anchor="middle" font-size="14">Matematika • 8 / 30</text>
    <text class="b" x="32" y="128" font-size="30">log2(8) ning qiymatini toping.</text>
    <text class="dim" x="32" y="164" font-size="16">Bitta to'g'ri javobni tanlang. Har bir savol 3 ball.</text>

    <g transform="translate(32 216)">
      <rect class="well" width="776" height="74" rx="6"/>
      <circle class="chip" cx="34" cy="37" r="16"/>
      <text class="dim b" x="34" y="43" text-anchor="middle" font-size="15">A</text>
      <text x="70" y="43" font-size="18">2</text>
    </g>
    <!-- Tanlangan variant: to'ldirilgan doira emas, holat qutisi + belgisi
         (ikkala mavzuda ham kontrast bir xil qoladi). -->
    <g transform="translate(32 306)">
      <rect class="ok-box" width="776" height="74" rx="6"/>
      <circle class="ok-box" cx="34" cy="37" r="16"/>
      <text class="ok b" x="34" y="43" text-anchor="middle" font-size="15">B</text>
      <text class="b" x="70" y="43" font-size="18">3</text>
      <g class="icon ok" transform="translate(660 28) scale(.75)"><path d="M20 6L9 17l-5-5"/></g>
      <text class="ok b" x="688" y="43" font-size="14">Tanlandi</text>
    </g>
    <g transform="translate(32 396)">
      <rect class="well" width="776" height="74" rx="6"/>
      <circle class="chip" cx="34" cy="37" r="16"/>
      <text class="dim b" x="34" y="43" text-anchor="middle" font-size="15">C</text>
      <text x="70" y="43" font-size="18">4</text>
    </g>

    <g transform="translate(32 494)">
      <rect class="chip" width="144" height="44" rx="4"/>
      <text class="b" x="72" y="28" text-anchor="middle" font-size="14">Oldingi</text>
      <rect class="stamp-fill" x="620" width="156" height="44" rx="4"/>
      <text class="on-stamp b" x="698" y="28" text-anchor="middle" font-size="14">Keyingi</text>
    </g>
  </g>

  <!-- Savollar navigatori -->
  <g transform="translate(988 176)">
    <rect class="card" width="294" height="560" rx="8"/>
    <text class="b" x="28" y="42" font-size="21">Savollar</text>
    <text class="dim" x="28" y="68" font-size="14">Javob holati</text>
    <g transform="translate(28 100)">
      <rect class="track" width="238" height="10" rx="5"/>
      <rect class="ac" width="66" height="10" rx="5"/>
      <text class="dim" x="0" y="38" font-size="13">8 ta javob berildi</text>
      <text class="b" x="238" y="38" text-anchor="end" font-size="13">27%</text>
    </g>
    <g transform="translate(28 170)" font-size="14" text-anchor="middle">
      <g><rect class="pencil-box" width="40" height="40" rx="4"/><text class="pencil b" x="20" y="26">1</text></g>
      <g transform="translate(50 0)"><rect class="pencil-box" width="40" height="40" rx="4"/><text class="pencil b" x="20" y="26">2</text></g>
      <g transform="translate(100 0)"><rect class="pencil-box" width="40" height="40" rx="4"/><text class="pencil b" x="20" y="26">3</text></g>
      <g transform="translate(150 0)"><rect class="pencil-box" width="40" height="40" rx="4"/><text class="pencil b" x="20" y="26">4</text></g>
      <g transform="translate(200 0)"><rect class="pencil-box" width="40" height="40" rx="4"/><text class="pencil b" x="20" y="26">5</text></g>
      <g transform="translate(0 52)"><rect class="pencil-box" width="40" height="40" rx="4"/><text class="pencil b" x="20" y="26">6</text></g>
      <g transform="translate(50 52)"><rect class="pencil-box" width="40" height="40" rx="4"/><text class="pencil b" x="20" y="26">7</text></g>
      <g transform="translate(100 52)"><rect class="stamp-fill" width="40" height="40" rx="4"/><text class="on-stamp b" x="20" y="26">8</text></g>
      <g transform="translate(150 52)"><rect class="chip" width="40" height="40" rx="4"/><text class="dim" x="20" y="26">9</text></g>
      <g transform="translate(200 52)"><rect class="chip" width="40" height="40" rx="4"/><text class="dim" x="20" y="26">10</text></g>
    </g>
    <g transform="translate(28 424)">
      <rect class="warn-box" width="238" height="84" rx="6"/>
      <text class="warn b" x="20" y="30" font-size="14">Diqqat</text>
      <text class="dim" x="20" y="52" font-size="13">Vaqt tugaganda test</text>
      <text class="dim" x="20" y="70" font-size="13">avtomatik yopiladi.</text>
    </g>
  </g>
</svg>
