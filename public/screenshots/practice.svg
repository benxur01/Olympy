      <text x="46" y="29">Asosiy</text>
      <g class="icon" transform="translate(14 65) scale(.75)"><path d="M6 9H4.5a2.5 2.5 0 010-5H6M18 9h1.5a2.5 2.5 0 000-5H18M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22M18 2H6v7a6 6 0 0012 0V2z"/></g>
      <text x="46" y="79">Musobaqalar</text>
      <g class="icon" transform="translate(14 165) scale(.75)"><path d="M3 3v16a2 2 0 002 2h16M18 17V9M13 17V5M8 17v-3"/></g>
      <text x="46" y="179">Natijalar</text>
      <g class="icon" transform="translate(14 215) scale(.75)"><path d="M11.525 2.295a.53.53 0 01.95 0l2.31 4.679a2.123 2.123 0 001.595 1.16l5.166.756a.53.53 0 01.294.904l-3.736 3.638a2.123 2.123 0 00-.611 1.878l.882 5.14a.53.53 0 01-.771.56l-4.618-2.428a2.122 2.122 0 00-1.973 0L6.396 21.01a.53.53 0 01-.77-.56l.881-5.139a2.122 2.122 0 00-.611-1.879L2.16 9.795a.53.53 0 01.294-.906l5.165-.755a2.122 2.122 0 001.597-1.16z"/></g>
      <text x="46" y="229">Reyting</text>
      <g class="icon" transform="translate(14 265) scale(.75)"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 01-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 011-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 011.52 0C14.51 3.81 17 5 19 5a1 1 0 011 1z"/></g>
      <text x="46" y="279">Xatolar Sandig'i</text>
      <g class="icon" transform="translate(14 315) scale(.75)"><path d="M12.586 2.586A2 2 0 0011.172 2H4a2 2 0 00-2 2v7.172a2 2 0 00.586 1.414l8.704 8.704a2.426 2.426 0 003.42 0l6.58-6.58a2.426 2.426 0 000-3.42z"/><circle cx="7.5" cy="7.5" r="1.5"/></g>
      <text x="46" y="329">Do'kon</text>
      <g class="icon" transform="translate(14 365) scale(.75)"><path d="M19 21v-2a4 4 0 00-4-4H9a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></g>
      <text x="46" y="379">Profil</text>
    </g>
  </g>

  <g transform="translate(96 720)">
    <circle class="avatar" cx="24" cy="24" r="24"/>
    <text class="b" x="24" y="30" text-anchor="middle" font-size="15">AV</text>
    <text class="b" x="64" y="20" font-size="15">Ali Valiyev</text>
