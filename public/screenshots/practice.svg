      <text class="b" x="88" y="44" font-size="20">Fizika</text>
      <text class="dim" x="88" y="68" font-size="13">8 ta mavzu • 160 ta savol</text>
      <text class="dim" x="24" y="118" font-size="13">Progress</text>
      <rect class="track" x="24" y="132" width="250" height="10" rx="5"/>
      <rect class="warn" x="24" y="132" width="100" height="10" rx="5"/>
      <text class="b" x="24" y="174" font-size="13">40%</text>
      <rect class="chip" x="180" y="152" width="94" height="32" rx="4"/>
      <text class="ac b" x="227" y="173" text-anchor="middle" font-size="13">Kirish</text>
    </g>
    <g transform="translate(644 0)">
