<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="profile-title profile-desc" class="olympy-shot">
  <title id="profile-title">Olympy profile screenshot</title>
  <desc id="profile-desc">O'quvchi profili: yutuqlar, statistika, sertifikatlar va fanlar bo'yicha progress.</desc>
  <style>
    /* ─── Ranglar bu yerda QATTIQ yozilmagan ──────────────────────────────
       Qiymatlar sahifaning token qatlamidan (src/index.css) keladi. Bu fayl
       DOM ichiga INLINE joylanadi (pages/Landing.jsx), shuning uchun :root
       o'zgaruvchilari shu yerga meros bo'ladi va `data-theme` almashganda
       skrinshot ham o'zi qayta bo'yaladi — ikkinchi (light) nusxa kerak emas.

       var() zaxiralari faqat fayl ALOHIDA ochilganda ishlaydi (to'g'ridan
       to'g'ri brauzerda yoki img tegi orqali) — img tegi tashqi CSS'ni
       ko'rmaydi. Ilova ichida bu zaxiralar hech qachon qo'llanmaydi, shuning
       uchun token qiymatlari o'zgarsa bu fayllarni yangilash SHART EMAS.

       DIQQAT: bu style bloki ichida burchakli qavs ishlatilmaydi. SVG
       markup'i HTML parseri orqali DOM'ga inline joylanadi va u yerda
       style ichidagi burchakli qavs teg deb o'qilib, blokni buzadi.

       Yo'nalish: gradient yo'q, glow yo'q, rangli soya yo'q. Ajratish uchun
       1px chegara va bo'shliq. */
    svg.olympy-shot {
      --ground: rgb(var(--color-ground, 231 228 220));
      --s1: rgb(var(--color-surface-1, 238 236 229));
      --s2: rgb(var(--color-surface-2, 222 219 210));
      --edge: rgb(var(--color-edge, 199 195 184));
      --t2: rgb(var(--color-text-secondary, 98 101 111));
      --accent: rgb(var(--color-accent, 192 54 44));
      --stamp: rgb(var(--color-accent-fill, 192 54 44));
      --on-stamp: rgb(var(--color-on-accent, 251 243 242));
      --pencil: rgb(var(--color-accent-2, 47 93 140));
      --ok: rgb(var(--color-success, 47 107 68));
      --warn: rgb(var(--color-warning, 127 95 48));
      --err: rgb(var(--color-error, 168 62 23));
      color: rgb(var(--color-text-primary, 20 22 28));
      font-family: 'PT Sans', Arial, sans-serif;
    }
    .olympy-shot text { fill: currentColor }
    .olympy-shot .b { font-weight: 700 }
    .olympy-shot .desk { fill: var(--s2) }
    .olympy-shot .page { fill: var(--ground); stroke: var(--edge) }
    .olympy-shot .rail { fill: var(--s1) }
    .olympy-shot .card { fill: var(--s1); stroke: var(--edge) }
    .olympy-shot .well { fill: var(--ground); stroke: var(--edge) }
    .olympy-shot .chip { fill: var(--s2); stroke: var(--edge) }
    .olympy-shot .avatar { fill: var(--s2); stroke: var(--edge) }
    .olympy-shot .track { fill: var(--s2) }
    .olympy-shot .rule { fill: none; stroke: var(--edge) }
    /* Rang sinflari `color` ni ham o'rnatadi: shunda ayni shu elementdagi
       `.icon` ning `stroke: currentColor` i o'sha rangni oladi va matn bilan
       ikonka bir xil bo'yaladi (class="icon ok" kabi juftliklar uchun). */
    .olympy-shot .dim { fill: var(--t2); color: var(--t2) }
    .olympy-shot .ac { fill: var(--accent); color: var(--accent) }
    .olympy-shot .stamp-fill { fill: var(--stamp) }
    .olympy-shot .on-stamp { fill: var(--on-stamp); color: var(--on-stamp) }
    .olympy-shot .pencil { fill: var(--pencil); color: var(--pencil) }
    .olympy-shot .ok { fill: var(--ok); color: var(--ok) }
    .olympy-shot .warn { fill: var(--warn); color: var(--warn) }
    .olympy-shot .err { fill: var(--err); color: var(--err) }
    /* Holat qutilari — ilovaning badge naqshi (12% to'ldirish, 35% chegara). */
    .olympy-shot .ac-box { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-opacity: .35 }
    .olympy-shot .ok-box { fill: var(--ok); fill-opacity: .12; stroke: var(--ok); stroke-opacity: .35 }
    .olympy-shot .warn-box { fill: var(--warn); fill-opacity: .12; stroke: var(--warn); stroke-opacity: .35 }
    .olympy-shot .pencil-box { fill: var(--pencil); fill-opacity: .12; stroke: var(--pencil); stroke-opacity: .35 }
    /* Ikonkalar — shared.jsx dagi Icon komponenti bilan bir xil Lucide geometriyasi. */
    .olympy-shot .icon { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
  </style>
  <rect class="desk" width="1440" height="900"/>
  <rect class="page" x="76" y="60" width="1288" height="780" rx="10"/>

  <!-- Profil sarlavhasi -->
  <g transform="translate(126 112)">
    <circle class="avatar" cx="70" cy="70" r="70"/>
    <text class="b" x="70" y="84" text-anchor="middle" font-size="42">AV</text>
    <text class="b" x="168" y="48" font-size="32">Ali Valiyev</text>
    <text class="dim" x="168" y="82" font-size="16">ProSkill Academy • O'quvchi</text>
    <rect class="ok-box" x="168" y="108" width="124" height="38" rx="4"/>
    <text class="ok b" x="230" y="133" text-anchor="middle" font-size="14">Faol</text>
    <rect class="stamp-fill" x="954" y="26" width="154" height="46" rx="4"/>
    <text class="on-stamp b" x="1031" y="55" text-anchor="middle" font-size="14">Profilni sozlash</text>
  </g>

  <!-- Statistika -->
  <g transform="translate(126 286)">
    <rect class="card" width="258" height="132" rx="8"/>
    <text class="dim b" x="28" y="48" font-size="14">O'rtacha ball</text>
    <text class="b" x="28" y="98" font-size="42">87</text>
    <path class="ok" d="M176 92c30-45 52-56 76-80" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>

    <rect class="card" x="292" width="258" height="132" rx="8"/>
    <text class="dim b" x="320" y="48" font-size="14">Sertifikatlar</text>
    <text class="b" x="320" y="98" font-size="42">3</text>
    <circle class="warn-box" cx="488" cy="66" r="34"/>
    <g class="icon warn" transform="translate(474 52) scale(1.1667)"><path d="M15.477 12.89l1.515 8.526a.5.5 0 01-.81.47l-3.58-2.687a1 1 0 00-1.197 0l-3.586 2.686a.5.5 0 01-.81-.469l1.514-8.526"/><circle cx="12" cy="8" r="6"/></g>

    <rect class="card" x="584" width="258" height="132" rx="8"/>
    <text class="dim b" x="612" y="48" font-size="14">Top reyting</text>
    <text class="b" x="612" y="98" font-size="42">#3</text>
    <circle class="ac-box" cx="780" cy="66" r="34"/>
    <g class="icon ac" transform="translate(766 52) scale(1.1667)"><path d="M11.525 2.295a.53.53 0 01.95 0l2.31 4.679a2.123 2.123 0 001.595 1.16l5.166.756a.53.53 0 01.294.904l-3.736 3.638a2.123 2.123 0 00-.611 1.878l.882 5.14a.53.53 0 01-.771.56l-4.618-2.428a2.122 2.122 0 00-1.973 0L6.396 21.01a.53.53 0 01-.77-.56l.881-5.139a2.122 2.122 0 00-.611-1.879L2.16 9.795a.53.53 0 01.294-.906l5.165-.755a2.122 2.122 0 001.597-1.16z"/></g>

    <rect class="card" x="876" width="258" height="132" rx="8"/>
    <text class="dim b" x="904" y="48" font-size="14">Musobaqalar</text>
    <text class="b" x="904" y="98" font-size="42">12</text>
    <circle class="pencil-box" cx="1072" cy="66" r="34"/>
    <g class="icon pencil" transform="translate(1058 52) scale(1.1667)"><path d="M6 9H4.5a2.5 2.5 0 010-5H6M18 9h1.5a2.5 2.5 0 000-5H18M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22M18 2H6v7a6 6 0 0012 0V2z"/></g>
  </g>

  <!-- Yutuqlar -->
  <g transform="translate(126 458)">
    <rect class="card" width="538" height="278" rx="8"/>
    <text class="b" x="30" y="44" font-size="22">Yutuqlar</text>
    <g transform="translate(30 76)">
      <rect class="well" width="478" height="64" rx="6"/>
      <rect class="chip" x="16" y="16" width="32" height="32" rx="4"/>
      <g class="icon warn" transform="translate(24 24) scale(.6667)"><path d="M15.477 12.89l1.515 8.526a.5.5 0 01-.81.47l-3.58-2.687a1 1 0 00-1.197 0l-3.586 2.686a.5.5 0 01-.81-.469l1.514-8.526"/><circle cx="12" cy="8" r="6"/></g>
      <text class="b" x="70" y="28" font-size="15">Informatika Olimpiadasi</text>
      <text class="dim" x="70" y="50" font-size="13">1-o'rin • 91 ball</text>
      <text class="warn b" x="458" y="39" text-anchor="end" font-size="13">Sertifikat</text>
    </g>
    <g transform="translate(30 154)">
      <rect class="well" width="478" height="64" rx="6"/>
      <rect class="chip" x="16" y="16" width="32" height="32" rx="4"/>
      <g class="icon ac" transform="translate(24 24) scale(.6667)"><path d="M11.525 2.295a.53.53 0 01.95 0l2.31 4.679a2.123 2.123 0 001.595 1.16l5.166.756a.53.53 0 01.294.904l-3.736 3.638a2.123 2.123 0 00-.611 1.878l.882 5.14a.53.53 0 01-.771.56l-4.618-2.428a2.122 2.122 0 00-1.973 0L6.396 21.01a.53.53 0 01-.77-.56l.881-5.139a2.122 2.122 0 00-.611-1.879L2.16 9.795a.53.53 0 01.294-.906l5.165-.755a2.122 2.122 0 001.597-1.16z"/></g>
      <text class="b" x="70" y="28" font-size="15">Matematika Olimpiadasi</text>
      <text class="dim" x="70" y="50" font-size="13">3-o'rin • 87 ball</text>
      <text class="ac b" x="458" y="39" text-anchor="end" font-size="13">Top 3</text>
    </g>
  </g>

  <!-- Fanlar progressi -->
  <g transform="translate(706 458)">
    <rect class="card" width="554" height="278" rx="8"/>
    <text class="b" x="30" y="44" font-size="22">Fanlar progressi</text>
    <g transform="translate(30 84)">
      <text class="b" y="18" font-size="15">Matematika</text>
      <text class="b" x="494" y="18" text-anchor="end" font-size="15">87%</text>
      <rect class="track" y="36" width="494" height="12" rx="6"/>
      <rect class="ac" y="36" width="430" height="12" rx="6"/>
    </g>
    <g transform="translate(30 142)">
      <text class="b" y="18" font-size="15">Informatika</text>
      <text class="b" x="494" y="18" text-anchor="end" font-size="15">91%</text>
      <rect class="track" y="36" width="494" height="12" rx="6"/>
      <rect class="pencil" y="36" width="450" height="12" rx="6"/>
    </g>
    <g transform="translate(30 200)">
      <text class="b" y="18" font-size="15">Fizika</text>
      <text class="b" x="494" y="18" text-anchor="end" font-size="15">72%</text>
      <rect class="track" y="36" width="494" height="12" rx="6"/>
      <rect class="ok" y="36" width="356" height="12" rx="6"/>
    </g>
  </g>
</svg>
